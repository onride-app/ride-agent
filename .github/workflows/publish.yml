name: Publish Rider
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-production
  cancel-in-progress: false
jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    environment: npm-production
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ride_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: ride_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ride_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          RIDE_AGENT_TEST_DATABASE_URL: postgresql://ride_test:isolated_ci_only@127.0.0.1:5432/ride_test
      - run: npm run test:functional
        env:
          RIDE_AGENT_FUNCTIONAL_DATABASE_URL: postgresql://ride_test:isolated_ci_only@127.0.0.1:5432/ride_test
      - run: npm run verify:package
      - run: npm run verify:release -- --online
      # Bind this exact repository, publish.yml and npm-production on npm first.
      - run: npm publish --access public --provenance
