<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Rider · 对话内入金确认测试</title>
    <style>
      /*INLINE_CSS*/:root {
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  color: #171717;
  background: #fcfbf8;
  font-size: 14px;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  padding: 20px;
}
main {
  max-width: 900px;
  margin: auto;
}
.brand {
  font-size: 24px;
  font-weight: 850;
  letter-spacing: -1px;
}
.brand span {
  background: #ffd94a;
  padding: 2px 8px;
  border-radius: 6px;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
}
h1 {
  font-size: 25px;
  letter-spacing: -0.7px;
  margin: 8px 0 6px;
}
h2 {
  font-size: 16px;
  margin: 0 0 12px;
}
.muted {
  color: #666;
  line-height: 1.6;
}
.card {
  background: white;
  border: 1px solid #e2e2da;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 12px;
}
.grid {
  margin-bottom: 12px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.grid .card {
  margin: 0;
}
.row {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 8px 0;
  border-bottom: 1px solid #f0f0eb;
}
.row:last-child {
  border: 0;
}
.row strong {
  text-align: right;
}
.metric {
  font-size: 24px;
  font-weight: 750;
}
.tag {
  border-radius: 99px;
  background: #f1f1e9;
  padding: 5px 9px;
  font-size: 12px;
}
.warning {
  border-left: 3px solid #f6d600;
  background: #fffce2;
  padding: 12px;
  line-height: 1.6;
  border-radius: 8px;
  margin: 14px 0;
}
button,
.button {
  background: #ffd94a;
  color: #111;
  border: 0;
  border-radius: 10px;
  padding: 13px 18px;
  font-weight: 750;
  cursor: pointer;
  display: inline-block;
  text-decoration: none;
}
button.secondary {
  background: #eee;
}
button:disabled {
  opacity: 0.5;
  cursor: wait;
}
.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 16px;
}
.error {
  color: #a32626;
}
.good {
  color: #147a4b;
}
table {
  border-collapse: collapse;
  width: 100%;
  font-size: 13px;
}
th,
td {
  padding: 10px 6px;
  text-align: left;
  border-bottom: 1px solid #eee;
}
.table-wrap {
  overflow-x: auto;
}
input,
select {
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font: inherit;
  width: 100%;
  margin: 6px 0 14px;
}
details {
  margin-top: 14px;
}
pre {
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 12px;
}
footer {
  margin: 18px 0;
  font-size: 12px;
  color: #666;
}
.status {
  font-size: 12px;
  letter-spacing: 0.2px;
  text-transform: uppercase;
}
@media (max-width: 520px) {
  body {
    padding: 14px;
  }
  .grid {
    grid-template-columns: 1fr;
  }
  h1 {
    font-size: 22px;
  }
  .card {
    padding: 15px;
  }
  .row {
    gap: 8px;
  }
  .metric {
    font-size: 21px;
  }
}
[hidden] {
  display: none !important;
}
.field {
  display: block;
  color: #666;
  font-size: 12px;
  margin-top: 10px;
}
.field input,
.field select {
  display: block;
  color: #171717;
  margin-top: 6px;
}
td,
th {
  overflow-wrap: anywhere;
}
.card .grid {
  margin-top: 12px;
}
.card h2:not(:first-child) {
  margin-top: 20px;
}
summary {
  cursor: pointer;
  font-weight: 700;
  padding: 12px 0;
}
.grid .card button {
  margin-top: 10px;
  padding: 8px 12px;
  font-size: 12px;
}
@media (min-width: 820px) {
  .grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

.performance-chart svg {
  width: 100%;
  height: auto;
  display: block;
}
.deposit-qr {
  display: block;
  max-width: 100%;
  height: auto;
  margin: 16px auto;
}
.deposit-address {
  display: block;
  overflow-wrap: anywhere;
  padding: 12px;
  background: #f5f3ec;
  border-radius: 8px;
}
.field input[type="checkbox"] {
  width: auto;
}
.confirmation-frame {
  width: 100%;
  height: 680px;
  border: 1px solid #e2e2da;
  border-radius: 16px;
  background: #fcfbf8;
}
</style>
  </head>
  <body>
    <main>
      <header>
        <strong class="brand">Rider</strong
        ><span class="tag">0 USDC 模拟 · 不会转账</span>
      </header>
      <section class="card">
        <h1>在对话内确认入金</h1>
        <p>金额：0 USDC · Arbitrum · 虚构测试账户</p>
        <p>此演示不连接账户、钱包或交易服务。点击后仅更新本卡片的演示状态。</p>
        <p id="status" role="status" class="warning">等待模拟确认</p>
        <div class="actions">
          <button id="confirm">模拟确认入金 · 0 USDC</button
          ><button id="cancel" class="secondary">取消演示</button>
        </div>
      </section>
    </main>
    <script>
      const status = document.getElementById("status");
      function announce(state) {
        window.parent.postMessage(
          {
            type: "ride:funding-state",
            status: state,
            height: document.body.scrollHeight + 24,
          },
          "*",
        );
      }
      for (const [id, state, text] of [
        [
          "confirm",
          "demo_confirmed",
          "模拟确认成功 · 全程留在对话卡片内 · 未签名或提交真实转账",
        ],
        ["cancel", "demo_rejected", "演示已取消 · 未签名或提交真实转账"],
      ])
        document.getElementById(id).onclick = () => {
          status.textContent = text;
          status.className = "good";
          document.getElementById("confirm").disabled = true;
          document.getElementById("cancel").disabled = true;
          announce(state);
        };
      announce("demo_ready");
    </script>
  </body>
</html>
