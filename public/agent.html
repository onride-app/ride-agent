  const node = document.createElement(tag);
  if (text !== undefined && text !== null) node.textContent = String(text);
  if (cls) node.className = cls;
  return node;
};
const val = (v) => (v === null || v === undefined ? "Unavailable" : String(v));
const row = (label, value) => {
  const r = el("div", null, "row");
  r.append(el("span", label, "muted"), el("strong", val(value)));
  return r;
};
const card = (title) => {
  const c = el("section", null, "card");
  c.append(el("h2", title));
  return c;
};
const usdc = (v) => (v == null ? "Unavailable" : `${v} USDC`);
const sumCash = (amounts) => {
  const n = amounts.reduce((total, v) => {
    const [whole, fraction = ""] = String(v).split(".");
    return total + BigInt(whole) * 1000000n + BigInt(fraction.padEnd(6, "0"));
  }, 0n);
  return `${n / 1000000n}.${String(n % 1000000n).padStart(6, "0")}`;
};
function sleeveCards(
  sleeves,
  callTool,
  addTrader,
  actionLabel = "Add to basket",
) {
  const grid = el("div", null, "grid");
  for (const s of sleeves) {
    const c = card(s.trader?.handle ?? s.copy_id);
    c.append(
      el("span", `${s.trader?.market ?? ""} · ${s.trader?.style ?? ""}`, "tag"),
      row("Copy Score", s.trader?.score),
      row("Allocation", usdc(s.amount_usdc)),
      ...(s.leverage_mode != null
        ? [row("Leverage mode", "Follow source leverage")]
        : []),
      row(
        s.leverage_mode != null ? "Your leverage cap" : "Leverage cap",
        s.leverage_cap == null && s.leverage_mode === "follow_source"
          ? "No extra cap"
          : s.leverage_cap == null
            ? null
            : `${s.leverage_cap}x`,
      ),
      ...(s.leverage_cap_source === "inherited" ||
      (s.trader?.market === "perps" &&
        s.leverage_cap != null &&
        !s.leverage_mode)
        ? [
            el(
              "p",
              `继承旧设置：${s.leverage_cap == null ? "无额外上限" : `${s.leverage_cap}x`}。清空杠杆上限并重新计算，可改为跟随源杠杆；交易所限制仍适用。`,
              "muted",
            ),
          ]
        : []),
      row(
        s.loss_policy === "pause_then_exit"
          ? "Pause new exposure"
          : "Sleeve exit trigger",
        s.stop_loss_pct == null ? null : `${s.stop_loss_pct}%`,
      ),
      row("Copy mode", s.copy_mode ?? "Rider recommended"),
      ...(s.copy_mode === "fixed"
        ? [row("Fixed margin per source entry", usdc(s.fixed_margin_usdc))]
        : []),
      ...(s.loss_policy === "pause_then_exit"
        ? [row("Emergency exit", `${s.emergency_exit_pct ?? 70}%`)]
        : []),
    );
    if (s.state)
      c.append(
        row("State", s.state),
        row("Net contribution", usdc(s.net_profit_usdc)),
      );
    if (s.projected_state)
      c.append(row("预计状态（确认后）", s.projected_state));
    if (callTool) {
      const b = el("button", "Trader details", "secondary");
      b.addEventListener("click", () =>
        callTool("get_trader_profile", { trader_id: s.trader.id }),
      );
      c.append(b);
    }
    if (addTrader && s.amount_usdc == null) {
      const add = el("button", actionLabel, "secondary");
      add.addEventListener("click", () => addTrader(s.trader));

    }

}
function render(

  }
  if (value.data?.preference_saved)
    root.append(el("p", "Preferences saved", "status"));
  else if (

      el(
        "p",
        {
          queued: "Confirmed changes queued",
          executing: "Execution in progress",
          uncertain: "Execution status needs verification",
          settling: "Settlement pending",

        "status",
      ),
    );

  if (
    confirmationCard &&
    d.proposal &&
    (d.proposal.status === "requires_confirmation" ||
      d.confirmation_demo ||
      d.confirmation_card)
  ) {
    root.append(
      el(
        "h1",
        d.confirmation_demo
          ? "确认卡片测试"
          : d.proposal.status === "requires_confirmation"
            ? "确认本次操作"
            : "操作状态记录",
      ),
    );
    confirmationCard(root, d.proposal, d.confirmation_demo === true);
    return;
  }
  if (d.account?.authenticated) {
    root.append(
      el(
        "p",
        `Signed in${d.account.display_name ? `: ${d.account.display_name}` : ""}`,
        "muted",
      ),
    );
  }
  const appCopies =
    d.app_copies ?? (d.query_scope === "ride_app_copies" ? d : null);
  if (appCopies) {
    const account = card("Your Ride App copies");
    for (const [name, market] of [
      ["Perps", appCopies.perps],
      ["Prediction", appCopies.prediction],
    ]) {
      account.append(
        row(`${name} copy configurations`, market?.configs?.length),
        row(
          `${name} enabled copies`,
          market?.configs?.filter((c) => c.isEnabled).length,
        ),
        row(`${name} current copied positions`, market?.positions?.length),
      );
    }
    account.append(
      el(
        "p",
        appCopies.coverage_complete
          ? "Account read complete. Manage these existing copies in Ride."
          : "Account read incomplete. Missing copies or positions are unavailable.",
        "muted",
      ),
    );
    root.append(account);
  }
  if (d.account_balances)
    renderAccountBalances(root, d.account_balances, callTool);
  if (value.error) root.append(el("p", value.error.message, "warning error"));
  if (d.recommendation_diagnostics && (value.error || !d.plan))
    renderRecommendationDiagnostics(root, d, callTool);
  if (Array.isArray(d.candidates)) renderCandidates(root, d, callTool);
  if (d.market_coverage)
    root.append(
      el(
        "p",
        `Allowed markets: ${d.market_coverage.requested}. Selected: ${d.market_coverage.selected.join(", ")}. Either market may be selected; both are not required.`,
        "muted",
      ),
    );
  if (d.deposit_options)
    renderDepositOptions(root, d.deposit_options, callTool);
  if (d.deposit) renderDeposit(root, d.deposit, callTool);
  if (d.deposit_status) {
    const c = card("Deposit status");
    c.append(
      row("Status", d.deposit_status.status),
      row("Trading available", usdc(d.deposit_status.trading_balance_usdc)),
      row(
        "Saved plan shortfall",
        usdc(d.deposit_status.saved_plan_shortfall_usdc),
      ),
      row("Available to copy", d.deposit_status.available_to_copy),
      el("p", d.deposit_status.next_action, "muted"),
    );
    const check = el("button", "Check again", "secondary");
    check.addEventListener("click", () =>
      callTool("check_deposit_status", {
        deposit_id: d.deposit_status.deposit_id,
      }),
    );
    c.append(check);
    if (d.saved_plan_id) {
      const resume = el("button", "Refresh saved plan and review");
      resume.addEventListener("click", () =>
        callTool("recalculate_plan", { plan_id: d.saved_plan_id }),
      );
      c.append(resume);
    }
    root.append(c);
  }
  if (d.daily_checkin) {
    const c = card(
      d.daily_checkin.offer_review
        ? "Welcome back · daily portfolio review"
        : "Today’s check-in",
    );
    c.append(
      el(
        "p",
        d.daily_checkin.offer_review
          ? "Would you like to review the last 24 hours?"
          : "Your daily check-in has already been offered, or no Agent portfolio is active.",
        "muted",
      ),
    );
    if (d.daily_checkin.offer_review) {
      const b = el("button", "Review performance");
      b.addEventListener("click", () =>
        callTool("get_performance", {

          period: "daily",
        }),
      );
      c.append(b);
    }
    root.append(c);
  }

    welcome(
      root,
      callTool,
      d.preference_collection.answers,
      d.preference_collection,
    );
  } else if (d.preferences) {
    root.append(
      el(
        "p",
        `Assets: ${d.preferences.asset_category ?? "any"} · ${d.preferences.assets?.join(", ") || "no symbol restriction"}. Change preferences in the AI conversation.`,
        "muted",
      ),
    );
    if (d.preference_collection?.suggestions)
      root.append(
        el(
          "p",
          `Suggested portfolio loss trigger: ${d.preference_collection.suggestions.loss_trigger_pct}%. Review or change before confirming in Ride; this is not a guaranteed loss limit.`,
          "warning",
        ),
      );

  if (d.funding) {
    const c = card("Fund your trading account"),
      f = d.funding;
    c.append(

      row("Status", f.status),
      row("Destination", f.destination),
    );
    const b = el("button", "Review and confirm funding in Ride");
    b.addEventListener("click", () => openLink(f.confirmation_url));
    c.append(
      b,
      el(
        "p",
        "No funds move until you confirm in Ride. Submitted or uncertain requests must be checked before retrying.",
        "muted",
      ),
    );
    root.append(c);
  }
  if (d.plan) {
    const plan = d.plan;
    root.append(
      el(
        "h1",
        d.query_scope === "agent_portfolio_and_ride_app"

          : "Your trader basket",
      ),
      el(
        "p",
        `${usdc(plan.preferences.budget_usdc)} · ${plan.preferences.market} · ${plan.allocations.length} traders`,

      row(
        "Historical portfolio drawdown",
        d.portfolio_historical_drawdown_pct == null
          ? "Unavailable"
          : `${d.portfolio_historical_drawdown_pct}%`,
      ),
      row("Existing entry deviation", "≤ 0.2%"),
      row("Plan expires", new Date(plan.expires_at).toLocaleString()),
    );
    root.append(risk);
    const start = el("button", "Review start proposal");
    start.disabled = plan.expires_at <= Date.now();

        plan_id: plan.id,
        ...(start.dataset.compatibility
          ? { compatibility_ack: start.dataset.compatibility }
          : {}),
      }),
    );
    const refresh = el("button", "Refresh saved plan", "secondary");
    refresh.addEventListener("click", () =>

          "warning",
        ),
      );
    const actions = el("div", null, "actions");

    root.append(actions);
    root.append(

        "p",
        "Perps follows source leverage with no extra user cap by default. You can set or clear your cap; exchange limits, budget and risk checks still apply. A single-trader plan is concentrated. Review each trader’s pause/exit rules before confirming.",
        "muted",

          ["proportional", "Proportional"],
        ],

      );

          controls,
          "Fixed margin per source entry · USDC",
          "text",
          s.fixed_margin_usdc ?? "10",

const candidateSelections = new WeakMap();
function renderCandidates(root, data, callTool) {
  const candidates = data.candidates,
    pref = data.preferences ?? data.plan?.preferences;
  const c = card("Eligible trader candidates"),
    selected = new Set(

        data.plan?.allocations.map((a) => a.trader.id) ??
        [],
    );
  const meta = data.candidates_meta ?? { total: candidates.length };
  c.append(
    el(
      "p",
      `${candidates.length} returned · ${meta.total} eligible in total. Candidates and plan generation are separate.`,
      "muted",
    ),
  );
  if (!candidates.length)
    c.append(
      el(
        "p",
        "No eligible candidates under the current filters. Review the diagnostic rules below.",
      ),
    );
  const rows = el("div", null, "grid"),
    selection = el("p", "Select 1–8 traders to review a plan.", "muted");
  const generate = el("button", "Generate plan from selected traders");
  const update = () => {
    candidateSelections.set(data, [...selected]);
    generate.disabled = !pref || selected.size < 1 || selected.size > 8;
    selection.textContent = `${selected.size} traders selected · ${pref?.budget_usdc ?? "Unavailable"} USDC budget · risk and loss settings unchanged`;
  };
  let shown = 0;
  const more = el("button", "Load more candidates", "secondary");
  const appendPage = () => {
    for (const t of candidates.slice(shown, shown + 8)) {
      const r = card(t.handle);
      r.append(
        row(
          "Market / category",
          `${t.market} / ${t.asset_category ?? "unavailable"}`,
        ),
        row("Copy Score", t.score),
        ...historyRows(t),
        row("Trading assets", t.assets?.join(", ") || "Unavailable"),
        row("Qualification", t.eligibility),
      );
      const info = (
        data.recommendation_diagnostics?.candidate_evaluations ?? []
      ).find((x) => x.trader_id === t.id);
      if (info)
        r.append(
          row(
            "Fits requested per-trader budget",
            info.budget_eligible ? "Yes" : "No · review the allocation minimum",
          ),
        );
      const label = el("label", "Select trader", "field"),
        check = el("input");
      check.type = "checkbox";
      check.checked = selected.has(t.id);
      check.addEventListener("change", () => {
        if (check.checked) selected.add(t.id);
        else selected.delete(t.id);
        update();
      });
      label.append(check);
      const details = el("button", "Trader details", "secondary");
      details.addEventListener("click", () =>
        callTool("get_trader_profile", { trader_id: t.id }),
      );
      r.append(label, details);
      rows.append(r);
    }
    shown = Math.min(candidates.length, shown + 8);
    more.hidden = shown >= candidates.length;
    more.textContent = `Load remaining candidates (${candidates.length - shown})`;
  };
  more.addEventListener("click", appendPage);
  appendPage();
  update();
  generate.addEventListener("click", () =>
    callTool("recommend_traders", {
      preferences: {
        ...pref,
        portfolio_kind: selected.size === 1 ? "single" : "basket",
        basket_size: selected.size,
      },
      trader_ids: [...selected],
    }),
  );

}

function field(parent, label, type, value) {
  const wrap = el("label", label, "field");
  const input = el("input");
  input.type = type;
  input.value = String(value);
  wrap.append(input);
  parent.append(wrap);
  return input;
}
function select(parent, label, options, value) {
  const wrap = el("label", label, "field"),
    input = el("select");
  for (const [id, text] of options) {
    const option = el("option", text);
    option.value = id;
    input.append(option);
  }
  input.value = value;
  wrap.append(input);
  parent.append(wrap);
  return input;
}
function welcome(root, callTool, pref = {}, collection) {
  root.append(
    el("h1", "Plan your copy trading in conversation"),
    el(
      "p",
      collection?.questions?.map((q) => q.question).join(" ") ||
        "Tell your AI your USDC budget and risk preference: conservative, balanced or aggressive.",
      "muted",
    ),
    el(
      "p",
      "Assets default to all Crypto and RWA; Perps and Prediction are both allowed unless you choose otherwise. Ride suggests the trader count and allocation. Review all parameters before confirming in Ride.",
      "muted",
    ),
  );

    pref.budget_usdc == null
      ? field(details, "Budget · USDC", "text", "")
      : null;
  if (budget) budget.inputMode = "decimal";
  const tolerance =
    !pref.risk_tolerance && pref.loss_trigger_pct == null
      ? select(
          details,
          "Risk preference",
          [
            ["", "Choose"],
            ["low", "Conservative"],
            ["medium", "Balanced"],
            ["high", "Aggressive"],
          ],
          "",
        )
      : null;

        ...(fixed ? { fixed_margin_usdc: fixed.value.trim() } : {}),

function drawPerformance(root, points, metric, label) {
  root.replaceChildren(el("h3", label));
  const valid = points.filter(
    (p) => p[metric] != null && Number.isFinite(Number(p[metric])),
  );
  if (!valid.length) {
    root.append(el("p", "Verified history is unavailable.", "muted"));
    return;
  }
  const ns = "http://www.w3.org/2000/svg",
    svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 640 220");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", `${label} in USDC`);
  const min = Math.min(...valid.map((p) => Number(p[metric]))),
    max = Math.max(...valid.map((p) => Number(p[metric]))),
    range = Math.max(1, max - min);
  const first = points[0].at,
    last = points.at(-1).at,
    span = Math.max(1, last - first),
    segments = [];
  let segment = [];
  let previous = null;
  for (const p of points) {
    if (p[metric] == null || !Number.isFinite(Number(p[metric]))) {
      if (segment.length) segments.push(segment);
      segment = [];
      previous = null;
      continue;
    }
    if (previous && p.at - previous.at > 2 * 86400000) {
      if (segment.length) segments.push(segment);
      segment = [];
    }
    const x = 62 + ((p.at - first) / span) * 558,
      y = 178 - ((Number(p[metric]) - min) / range) * 140;
    segment.push([x, y]);
    previous = p;
    const dot = document.createElementNS(ns, "circle");
    dot.setAttribute("cx", x);
    dot.setAttribute("cy", y);
    dot.setAttribute("r", "3");
    dot.setAttribute("fill", "#8c740c");
    const title = document.createElementNS(ns, "title");
    title.textContent = `${new Date(p.at).toLocaleDateString()}: ${p[metric]} USDC`;
    dot.append(title);
    svg.append(dot);
  }
  if (segment.length) segments.push(segment);
  for (const values of segments) {
    const path = document.createElementNS(ns, "polyline");
    path.setAttribute("points", values.map((v) => v.join(",")).join(" "));
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "#c3a017");
    path.setAttribute("stroke-width", "2");
    svg.append(path);
  }
  for (const [value, y] of [
    [max, 38],
    [min, 178],
  ]) {
    const text = document.createElementNS(ns, "text");
    text.setAttribute("x", "4");
    text.setAttribute("y", y);
    text.setAttribute("font-size", "11");
    text.textContent = value.toFixed(2);
    svg.append(text);
  }
  root.append(
    svg,
    el(
      "p",
      metric === "account_value_usdc"
        ? "Account value includes external funding. Use net profit to assess trading performance."
        : "Net profit excludes external deposits and withdrawals. Missing periods remain gaps.",
      "muted",
    ),
  );
}

function addToPlan(plan, trader, data, callTool) {
  if (plan.allocations.some((a) => a.trader.id === trader.id)) return;
  if (plan.preferences.portfolio_kind === "single") {
    const allocation = plan.allocations[0];
    const limit =
      data.candidate_limits?.find((x) => x.trader_id === trader.id)
        ?.maximum_leverage_cap ?? (trader.market === "prediction" ? 1 : 40);
    callTool("recalculate_plan", {
      plan_id: plan.id,
      preferences: plan.preferences,
      allocations: [
        {
          trader_id: trader.id,
          amount_usdc: allocation.amount_usdc,
          leverage_cap:
            trader.market === "prediction"
              ? 1
              : allocation.leverage_cap == null
                ? null
                : Math.min(allocation.leverage_cap, limit),
          stop_loss_pct: allocation.stop_loss_pct,
          ...copyParameters(allocation),
        },
      ],
    });
    return;
  }
  const max =
    plan.preferences.portfolio_kind === "single"
      ? 1
      : plan.preferences.portfolio_kind === "basket"
        ? 8
        : 6;
  if (plan.allocations.length >= max) return;
  const values = [
    ...plan.allocations,
    {
      trader,
      leverage_cap: trader.market === "prediction" ? 1 : null,
      stop_loss_pct: 30,
      ...copyParameters(plan.preferences),
    },
  ];
  const [whole, fraction = ""] = String(plan.preferences.budget_usdc).split(
      ".",
    ),
    total = BigInt(whole) * 1000000n + BigInt(fraction.padEnd(6, "0")),
    count = BigInt(values.length),
    base = total / count,
    remainder = total % count;
  callTool("recalculate_plan", {
    plan_id: plan.id,
    preferences: plan.preferences,
    allocations: values.map((a, i) => {
      const amount = base + (BigInt(i) < remainder ? 1n : 0n);
      return {
        trader_id: a.trader.id,
        amount_usdc: `${amount / 1000000n}.${String(amount % 1000000n).padStart(6, "0")}`,
        leverage_cap: a.leverage_cap,
        stop_loss_pct: a.stop_loss_pct,
        ...copyParameters(a),
      };
    }),
  });
}

          request("ui/update-model-context", {
            content: [{ type: "text", text: JSON.stringify(context) }],
          }).catch(() => {});
      }
      if (Number.isFinite(event.data.height))
        frame.style.height = `${Math.min(1400, Math.max(420, event.data.height))}px`;
    };
    const cleanup = () => {
      clearTimeout(readyTimeout);
      window.removeEventListener("message", onMessage);
      frameCleanups.delete(cleanup);
    };
    frameCleanups.add(cleanup);
    window.addEventListener("message", onMessage);
    container.append(
      el(
        "p",
        demo
          ? "0 USDC 界面测试 · 不连接账户或执行服务"
          : funding
            ? `${proposal.amount_usdc} USDC · ${proposal.network} · 入金结果以上方卡片状态为准`
            : `操作 ${proposal.action} · 状态 ${proposal.status} · 请在 Ride 中核对完整方案`,
        "muted",
      ),
    );
    if (proposal.confirmation_url) {
      const fallback = el("button", "在 Ride 页面中打开", "secondary");
      const fallbackUrl = demo
        ? new URL("/agent/card-demo", base).href
        : proposal.confirmation_url;
      fallback.onclick = () => openLink(fallbackUrl);
      container.append(fallback);
    }
  } catch (error) {
    showError(error.message);
  }
}
function request(method, params) {
  const id = ++requestId;
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      pending.delete(id);
      reject(
        new Error(
          "The host did not respond. Use the equivalent Ride tool or CLI command in the conversation.",
        ),
      );
    }, 30000);
    pending.set(id, { resolve, reject, timer });
    window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
  });
}
let busy = false;
async function callTool(name, args) {
  if (busy) return;
  busy = true;
  const buttons = [...root.querySelectorAll("button,input,select")].map(
    (button) => ({ button, disabled: button.disabled }),
  );
  buttons.forEach(({ button }) => {
    button.disabled = true;
  });
  try {
    const reply = window.openai?.callTool
      ? await window.openai.callTool(name, args)
      : await request("tools/call", { name, arguments: args });
    const value = reply?.structuredContent ?? (reply?.version ? reply : null);
    if (value) accept(value);
    else {
      const text = reply?.content?.find((x) => x.type === "text")?.text;
      if (text) accept(JSON.parse(text));
      else
        throw new Error(
          "The host returned no Ride result. Use the tool in the conversation.",
        );
    }
  } catch (e) {
    showError(e.message ?? "Rider request failed.");
  } finally {
    busy = false;
    buttons.forEach(({ button, disabled }) => {
      button.disabled = disabled;
    });
  }
}
async function openLink(url) {
  try {
    const target = new URL(url);
    if (target.protocol !== "https:" && target.hostname !== "127.0.0.1")
      throw new Error("Rider requires a secure confirmation URL.");
    const response = window.openai?.openExternal
      ? await window.openai.openExternal({ href: url })
      : await request("ui/open-link", { url });
    if (response?.isError)
      throw new Error(
        `The host could not open the link. Open Rider confirmation manually: ${url}`,
      );
  } catch (e) {
    showError(e.message);
  }
}
draw();
window.addEventListener("openai:set_globals", (event) =>
  accept(event.detail?.globals?.toolOutput),
);
window.addEventListener("message", (event) => {
  if (event.source !== window.parent) return;
  const msg = event.data;
  if (msg?.jsonrpc !== "2.0") return;
  // Requests from the host have their own id namespace. A host ping may have
  // the same id as our pending ui/initialize; it is not its response.
  if (typeof msg.method === "string" && msg.id !== undefined) {
    const supported = ["ping", "ui/resource-teardown"].includes(msg.method);
    if (msg.method === "ui/resource-teardown") {
      connected = false;
      sizeObserver?.disconnect();
      for (const cleanup of frameCleanups) cleanup();
      for (const entry of pending.values()) clearTimeout(entry.timer);
      pending.clear();
    }
    window.parent.postMessage(
      {
        jsonrpc: "2.0",
        id: msg.id,
        ...(supported
          ? { result: {} }
          : { error: { code: -32601, message: "Method not found" } }),
      },
      "*",
    );
    return;
  }
  const entry =
    msg.method === undefined && ("result" in msg || "error" in msg)
      ? pending.get(msg.id)
      : undefined;
  if (entry) {
    clearTimeout(entry.timer);
    pending.delete(msg.id);
    if (msg.error) entry.reject(new Error(msg.error.message));
    else entry.resolve(msg.result);
  }
  if (msg?.method === "ui/notifications/tool-result")
    if (msg.params?.structuredContent) accept(msg.params.structuredContent);
    else {
      const text = msg.params?.content?.find(
        (item) => item.type === "text",
      )?.text;
      if (text) {
        try {
          accept(JSON.parse(text));
        } catch {
          showError("Rider returned an unreadable result.");
        }
      }
    }
  if (msg.method === "ui/notifications/host-context-changed") {
    fixedHeight = typeof msg.params?.containerDimensions?.height === "number";
    notifySize();
  }
});
if (!window.openai?.callTool)
  request("ui/initialize", {
    appInfo: { name: "Rider", version: "0.5.3" },
    appCapabilities: {},
    protocolVersion: "2026-01-26",
  })
    .then((result) => {
      if (result?.protocolVersion !== "2026-01-26")
        throw Error("The host did not complete Ride card initialization.");
      connected = true;
      fixedHeight =
        typeof result.hostContext?.containerDimensions?.height === "number";
      window.parent.postMessage(
        { jsonrpc: "2.0", method: "ui/notifications/initialized" },
        "*",
      );
      if (typeof ResizeObserver !== "undefined") {
        sizeObserver = new ResizeObserver(notifySize);
        sizeObserver.observe(document.body);
      }
      notifySize();
    })
    .catch((e) => showError(e.message));
</script></body></html>
