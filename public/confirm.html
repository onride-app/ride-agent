<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rider · Confirmation</title><style>/*INLINE_CSS*/:root {
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  color: #171717;
  background: #fcfbf8;
  font-size: 14px;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  padding: 20px;
}
main {
  max-width: 900px;
  margin: auto;
}
.brand {
  font-size: 24px;
  font-weight: 850;
  letter-spacing: -1px;
}
.brand span {
  background: #ffd94a;
  padding: 2px 8px;
  border-radius: 6px;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
}
h1 {
  font-size: 25px;
  letter-spacing: -0.7px;
  margin: 8px 0 6px;
}
h2 {
  font-size: 16px;
  margin: 0 0 12px;
}
.muted {
  color: #666;
  line-height: 1.6;
}
.card {
  background: white;
  border: 1px solid #e2e2da;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 12px;
}
.grid {
  margin-bottom: 12px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.grid .card {
  margin: 0;
}
.row {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 8px 0;
  border-bottom: 1px solid #f0f0eb;
}
.row:last-child {
  border: 0;
}
.row strong {
  text-align: right;
}
.metric {
  font-size: 24px;
  font-weight: 750;
}
.tag {
  border-radius: 99px;
  background: #f1f1e9;
  padding: 5px 9px;
  font-size: 12px;
}
.warning {
  border-left: 3px solid #f6d600;
  background: #fffce2;
  padding: 12px;
  line-height: 1.6;
  border-radius: 8px;
  margin: 14px 0;
}
button,
.button {
  background: #ffd94a;
  color: #111;
  border: 0;
  border-radius: 10px;
  padding: 13px 18px;
  font-weight: 750;
  cursor: pointer;
  display: inline-block;
  text-decoration: none;
}
button.secondary {
  background: #eee;
}
button:disabled {
  opacity: 0.5;
  cursor: wait;
}
.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 16px;
}
.error {
  color: #a32626;
}
.good {
  color: #147a4b;
}
table {
  border-collapse: collapse;
  width: 100%;
  font-size: 13px;
}
th,
td {
  padding: 10px 6px;
  text-align: left;
  border-bottom: 1px solid #eee;
}
.table-wrap {
  overflow-x: auto;
}
input,
select {
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font: inherit;
  width: 100%;
  margin: 6px 0 14px;
}
details {
  margin-top: 14px;
}
pre {
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 12px;
}
footer {
  margin: 18px 0;
  font-size: 12px;
  color: #666;
}
.status {
  font-size: 12px;
  letter-spacing: 0.2px;
  text-transform: uppercase;
}
@media (max-width: 520px) {
  body {
    padding: 14px;
  }
  .grid {
    grid-template-columns: 1fr;
  }
  h1 {
    font-size: 22px;
  }
  .card {
    padding: 15px;
  }
  .row {
    gap: 8px;
  }
  .metric {
    font-size: 21px;
  }
}
[hidden] {
  display: none !important;
}
.field {
  display: block;
  color: #666;
  font-size: 12px;
  margin-top: 10px;
}
.field input,
.field select {
  display: block;
  color: #171717;
  margin-top: 6px;
}
td,
th {
  overflow-wrap: anywhere;
}
.card .grid {
  margin-top: 12px;
}
.card h2:not(:first-child) {
  margin-top: 20px;
}
summary {
  cursor: pointer;
  font-weight: 700;
  padding: 12px 0;
}
.grid .card button {
  margin-top: 10px;
  padding: 8px 12px;
  font-size: 12px;
}
@media (min-width: 820px) {
  .grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

.performance-chart svg {
  width: 100%;
  height: auto;
  display: block;
}
.deposit-qr {
  display: block;
  max-width: 100%;
  height: auto;
  margin: 16px auto;
}
.deposit-address {
  display: block;
  overflow-wrap: anywhere;
  padding: 12px;
  background: #f5f3ec;
  border-radius: 8px;
}
.field input[type="checkbox"] {
  width: auto;
}
.confirmation-frame {
  width: 100%;
  height: 680px;
  border: 1px solid #e2e2da;
  border-radius: 16px;
  background: #fcfbf8;
}
.auth-providers {
  display: grid;
  gap: 12px;
  margin-top: 24px;
}
.auth-providers button,
#login > button {
  width: 100%;
  min-height: 52px;
  font-size: 15px;
  font-weight: 650;
  border-radius: 12px;
}
button.google,
#sign-in {
  background: #fff;
  color: #171717;
  border: 1px solid #d6d6d2;
}
button.apple,
#sign-in-apple {
  background: #171717;
  color: white;
  border: 1px solid #171717;
}
#login {
  max-width: 520px;
  margin: 36px auto;
  padding: 32px;
}
#login h1 {
  line-height: 1.2;
}
#login > p {
  line-height: 1.6;
  color: #666;
}
button:focus-visible,
input:focus-visible {
  outline: 3px solid #e7bd00;
  outline-offset: 3px;
}
@media (max-width: 540px) {
  body {
    padding: 16px;
  }
  #login {
    margin-top: 24px;
    padding: 24px;
  }
  .brand {
    font-size: 21px;
  }
  header {
    gap: 12px;
  }
}

/* Matches Ride's native auth_gate_screen.dart and H5 auth-flow.css. */
:root {
  --ride-yellow: #ffdf00;
  --ride-ink: #1a1a1a;
  --ride-secondary: #666;
  --ride-page: #f5f5f5;
  --ride-line: #eee;
  font-family:
    "Ride Poppins",
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  color: var(--ride-ink);
  background: var(--ride-page);
  color-scheme: light;
}
body {
  margin: 0;
  background: var(--ride-page);
  font-family: inherit;
  color: var(--ride-ink);
}
main {
  max-width: 920px;
}
header {
  min-height: 48px;
  margin-bottom: 24px;
  gap: 16px;
}
.brand {
  font-size: 24px;
  font-weight: 600;
  letter-spacing: -1px;
}
.brand span {
  padding: 0;
  background: none;
}
h1 {
  font-size: 26px;
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.6px;
}
h2 {
  font-size: 16px;
  font-weight: 600;
  line-height: 1.4;
}
.card {
  border: 1px solid var(--ride-line);
  border-radius: 16px;
  padding: 22px;
  background: white;
}
.row {
  padding: 13px 0;
  gap: 16px;
  border-color: var(--ride-line);
  font-size: 13px;
  line-height: 1.6;
}
.row strong {
  font-weight: 500;
}
.tag {
  background: #ececec;
  font-size: 11px;
  font-weight: 500;
  padding: 6px 10px;
}
button,
.button {
  min-height: 50px;
  background: var(--ride-yellow);
  color: var(--ride-ink);
  border: 1px solid transparent;
  border-radius: 26px;
  padding: 13px 22px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.4;
}
button.secondary {
  color: var(--ride-ink);
  background: white;
  border-color: #e0e0e0;
}
button:disabled {
  cursor: default;
  opacity: 0.55;
}
button:hover:not(:disabled),
.button:hover {
  filter: brightness(0.97);
}
button:focus-visible,
input:focus-visible,
summary:focus-visible,
a:focus-visible {
  outline: 3px solid #d1ae00;
  outline-offset: 3px;
}
input,
select,
textarea {
  border-radius: 16px;
  border-color: #e0e0e0;
  background: white;
  font: inherit;
}
.warning {
  border-left: 0;
  border-radius: 14px;
  padding: 16px;
  background: #fff4bf;
  font-size: 13px;
}
.error {
  color: #a32626;
}
.actions {
  gap: 12px;
}
#actions {
  position: sticky;
  bottom: 0;
  padding: 16px 0 max(16px, env(safe-area-inset-bottom));
  background: var(--ride-page);
}
#actions > button {
  flex: 1;
  min-height: 56px;
}
#status {
  max-width: 560px;
  margin: 16px auto;
  font-size: 13px;
  line-height: 1.6;
}
#status:empty {
  display: none;
}
.confirmation-frame {
  background: var(--ride-page);
  border-radius: 20px;
  border-color: var(--ride-line);
}

/* Auth is an App screen rather than a web form floating in a card. */
body:has(#login:not([hidden])) {
  padding: 0;
}
body:has(#login:not([hidden])) > main {
  max-width: 480px;
}
body:has(#login:not([hidden])) > main > header {
  display: none;
}
body:has(#login:not([hidden])) #status {
  margin: 0 24px 24px;
}
#login.app-auth,
main.app-auth {
  width: min(100%, 480px);
  max-width: 480px;
  min-height: min(100svh, 900px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 20px;
  margin: 0 auto;
  padding: max(20px, env(safe-area-inset-top)) 0
    max(22px, env(safe-area-inset-bottom));
  border: 0;
  border-radius: 0;
  box-shadow: none;
  background: var(--ride-page);
}
.app-auth-visual {
  flex: 1 1 230px;
  width: 100%;
  min-height: 160px;
  max-height: 330px;
  background-image: var(--ride-auth-visual);
  background-position: center;
  background-size: contain;
  background-repeat: no-repeat;
}
.app-auth-brand {
  text-align: center;
  width: 100%;
  padding: 0 24px;
}
.app-auth-wordmark {
  font-size: 40px;
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: -1.5px;
}
.app-auth-tagline {
  margin-top: 6px;
  font-size: 15px;
  color: var(--ride-secondary);
  line-height: 1.55;
}
.app-auth-intro {
  width: min(330px, calc(100% - 48px));
  text-align: center;
}
.app-auth-intro h1 {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.5;
  letter-spacing: 0;
}
.app-auth-intro p {
  margin: 6px 0 0;
  color: var(--ride-secondary);
  font-size: 12px;
  line-height: 1.6;
}
.app-auth #sign-in-form {
  width: 100%;
  margin: 0;
}
.app-auth .auth-providers,
.app-auth .auth-actions {
  width: min(280px, calc(100% - 48px));
  display: grid;
  gap: 12px;
  margin: 0 auto;
}
.app-auth [hidden] {
  display: none !important;
}
.app-auth .auth-providers button,
.app-auth .auth-actions button,
.app-auth #sign-in,
.app-auth #sign-in-apple {
  width: 100%;
  min-height: 60px;
  height: 60px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 44px;
  background: white;
  color: var(--ride-ink);
  border: 1px solid #e7e7e7;
  border-radius: 30px;
  font-size: 13px;
  font-weight: 500;
  line-height: 1.35;
}
.app-auth .google::before,
.app-auth .apple::before,
.app-auth #sign-in::before,
.app-auth #sign-in-apple::before {
  content: "";
  position: absolute;
  left: 20px;
  top: 18px;
  width: 22px;
  height: 22px;
  background-image: var(--ride-google-icon);
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
}
.app-auth .apple::before,
.app-auth #sign-in-apple::before {
  background-image: var(--ride-apple-icon);
  filter: brightness(0);
}
.app-auth-policy {
  width: min(340px, calc(100% - 40px));
  margin: 0;
  text-align: center;
  font-size: 11px;
  color: var(--ride-secondary);
  line-height: 1.7;
}
.app-auth-policy a {
  color: var(--ride-ink);
  text-decoration: underline;
  text-underline-offset: 2px;
}
.app-auth .connection-permissions {
  width: min(330px, calc(100% - 48px));
  margin: 0;
  font-size: 11px;
  line-height: 1.6;
  color: var(--ride-secondary);
}
.connection-permissions summary {
  padding: 0;
  font-size: 11px;
  text-align: center;
  font-weight: 500;
}
.connection-permissions ul {
  margin: 10px 0 0;
  padding-left: 16px;
}
.connection-permissions li + li {
  margin-top: 8px;
}
.app-auth .status {
  margin: 12px 0 0;
  min-height: 0;
  color: var(--ride-secondary);
  font-size: 12px;
  line-height: 1.6;
}
.app-auth .status:empty {
  display: none;
}
.app-auth-page {
  margin: 0;
  padding: 0;
  background: var(--ride-page);
}
.app-auth .fallback {
  width: calc(100% - 48px);
  margin: 0;
  padding: 14px 0 0;
  border-top: 1px solid #e0e0e0;
  font-size: 11px;
}
.app-auth .fallback input,
.app-auth .fallback textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #e0e0e0;
}
.app-auth .fallback summary {
  font-size: 11px;
}
.app-auth .fallback .field {
  margin-top: 12px;
}
.app-auth .fallback label {
  display: block;
  margin-bottom: 8px;
}
.app-auth .fallback .actions {
  display: flex;
  margin-top: 12px;
}
.app-auth .fallback .actions button {
  min-height: 42px;
  flex: 1;
}
@media (max-width: 540px) {
  body {
    padding: 20px 16px;
  }
  header {
    margin-bottom: 20px;
  }
  .card {
    padding: 20px;
  }
  .grid {
    grid-template-columns: 1fr;
  }
  h1 {
    font-size: 23px;
  }
  #login.app-auth {
    padding-top: max(14px, env(safe-area-inset-top));
  }
}
@media (max-height: 740px) {
  #login.app-auth,
  main.app-auth {
    gap: 14px;
    min-height: 100svh;
  }
  .app-auth-visual {
    flex-basis: 150px;
    max-height: 220px;
    min-height: 100px;
  }
  .app-auth-wordmark {
    font-size: 34px;
  }
  .app-auth-intro p {
    font-size: 11px;
  }
}

            el(
              "p",
              `Inherited setting: ${s.leverage_cap == null ? "no extra cap" : `${s.leverage_cap}x`}. Clear the cap and recalculate to follow source leverage. Exchange limits still apply.`,
              "muted",
            ),
          ]
        : []),
      row(
        s.loss_policy === "pause_then_exit"
          ? "Pause new exposure"
          : "Sleeve exit trigger",
        s.stop_loss_pct == null ? null : `${s.stop_loss_pct}%`,
      ),
      row("Copy mode", s.copy_mode ?? "Rider recommended"),
      ...(s.copy_mode === "fixed"
        ? [row("Fixed margin per source entry", usdc(s.fixed_margin_usdc))]
        : []),
      ...(s.loss_policy === "pause_then_exit"
        ? [row("Emergency exit", `${s.emergency_exit_pct ?? 70}%`)]
        : []),
    );
    if (s.state)
      c.append(
        row("State", displayState(s.state)),
        row("Net contribution", usdc(s.net_profit_usdc)),
      );
    if (s.projected_state)
      c.append(
        row(
          "Expected status after confirmation",
          displayState(s.projected_state),
        ),
      );
    if (callTool) {
      const b = el("button", "Trader details", "secondary");
      b.addEventListener("click", () =>
        callTool("get_trader_profile", { trader_id: s.trader.id }),
      );
      c.append(b);
    }
    if (addTrader && s.amount_usdc == null) {
      const add = el("button", actionLabel, "secondary");
      add.addEventListener("click", () => addTrader(s.trader));
      c.append(add);
    }
    grid.append(c);
  }
  return grid;
}
function render(
  root,
  value,
  openLink = () => {},
  callTool = () => {},
  confirmationCard,
) {
  root.replaceChildren();
  if (!value) {
    welcome(root, callTool);
    return;
  }
  if (value.data?.funding && confirmationCard) {
    root.append(el("h1", "Confirm funding"));
    confirmationCard(root, value.data.funding, false, "funding");
    return;
  }
  if (value.data?.funding_demo && confirmationCard) {
    root.append(el("h1", "In-chat funding confirmation demo"));
    confirmationCard(
      root,
      { amount_usdc: "0", network: "Arbitrum" },
      true,
      "funding",
    );
    return;
  }
  if (value.data?.preference_saved)
    root.append(el("p", "Preferences saved", "status"));
  else if (
    ["queued", "executing", "uncertain", "settling"].includes(value.status)
  )
    root.append(
      el(
        "p",
        {
          queued: "Confirmed changes queued",
          executing: "Execution in progress",
          uncertain: "Execution status needs verification",
          settling: "Settlement pending",
        }[value.status],
        "status",
      ),
    );
  const d = value.data ?? {};
  if (
    confirmationCard &&
    d.proposal &&
    (d.proposal.status === "requires_confirmation" ||
      d.confirmation_demo ||
      d.confirmation_card)
  ) {
    root.append(
      el(
        "h1",
        d.confirmation_demo
          ? "Confirmation card demo"
          : d.proposal.status === "requires_confirmation"
            ? "Review and confirm"
            : "Operation status",
      ),
    );
    renderProposalRiskStatus(root, d);
    confirmationCard(root, d.proposal, d.confirmation_demo === true);
    return;
  }
  if (d.account?.authenticated) {
    root.append(
      el(
        "p",
        `Signed in${d.account.display_name ? `: ${d.account.display_name}` : ""}`,
        "muted",
      ),
    );
  }
  const appCopies =
    d.app_copies ?? (d.query_scope === "ride_app_copies" ? d : null);
  if (appCopies) {
    const account = card("Your Ride App copies");
    for (const [name, market] of [
      ["Perps", appCopies.perps],
      ["Prediction", appCopies.prediction],
    ]) {
      account.append(
        row(`${name} copy configurations`, market?.configs?.length),
        row(
          `${name} enabled copies`,
          market?.configs?.filter((c) => c.isEnabled).length,
        ),
        row(`${name} current copied positions`, market?.positions?.length),
      );
    }
    account.append(
      el(
        "p",
        appCopies.coverage_complete
          ? "Account read complete. Manage these existing copies in Ride."
          : "Account read incomplete. Missing copies or positions are unavailable.",
        "muted",
      ),
    );
    root.append(account);
  }
  if (d.account_balances)
    renderAccountBalances(root, d.account_balances, callTool);
  if (value.error) root.append(el("p", value.error.message, "warning error"));
  if (d.recommendation_diagnostics && (value.error || !d.plan))
    renderRecommendationDiagnostics(root, d, callTool);
  if (Array.isArray(d.candidates)) renderCandidates(root, d, callTool);
  if (d.market_coverage)
    root.append(
      el(
        "p",
        `Allowed markets: ${d.market_coverage.requested}. Selected: ${d.market_coverage.selected.join(", ")}. Either market may be selected; both are not required.`,
        "muted",
      ),
    );
  if (d.deposit_options)
    renderDepositOptions(root, d.deposit_options, callTool);
  if (d.deposit) renderDeposit(root, d.deposit, callTool);
  if (d.deposit_status) {
    const c = card("Deposit status");
    c.append(
      row("Status", d.deposit_status.status),
      row("Trading available", usdc(d.deposit_status.trading_balance_usdc)),
      row(
        "Saved plan shortfall",
        usdc(d.deposit_status.saved_plan_shortfall_usdc),
      ),
      row("Available to copy", d.deposit_status.available_to_copy),
      el("p", d.deposit_status.next_action, "muted"),
    );
    const check = el("button", "Check again", "secondary");
    check.addEventListener("click", () =>
      callTool("check_deposit_status", {
        deposit_id: d.deposit_status.deposit_id,
      }),
    );
    c.append(check);
    if (d.saved_plan_id) {
      const resume = el("button", "Refresh saved plan and review");
      resume.addEventListener("click", () =>
        callTool("recalculate_plan", { plan_id: d.saved_plan_id }),
      );
      c.append(resume);
    }
    root.append(c);
  }
  if (d.daily_checkin) {
    const c = card(
      d.daily_checkin.offer_review
        ? "Welcome back · daily portfolio review"
        : "Today’s check-in",
    );
    c.append(
      el(
        "p",
        d.daily_checkin.offer_review
          ? "Would you like to review the last 24 hours?"
          : "Your daily check-in has already been offered, or no Agent portfolio is active.",
        "muted",
      ),
    );
    if (d.daily_checkin.offer_review) {
      const b = el("button", "Review performance");
      b.addEventListener("click", () =>
        callTool("get_performance", {
          portfolio_id: d.daily_checkin.portfolio_id,
          period: "daily",
        }),
      );
      c.append(b);
    }
    root.append(c);
  }
  if (d.preference_collection && !d.preference_collection.ready) {
    welcome(
      root,
      callTool,
      d.preference_collection.answers,
      d.preference_collection,
    );
  } else if (d.preferences) {
    root.append(
      el(
        "p",
        `Assets: ${d.preferences.asset_category ?? "any"} · ${d.preferences.assets?.join(", ") || "no symbol restriction"}. Change preferences in the AI conversation.`,
        "muted",
      ),
    );
    if (d.preference_collection?.suggestions)
      root.append(
        el(
          "p",
          `Suggested portfolio loss trigger: ${d.preference_collection.suggestions.loss_trigger_pct}%. Review or change before confirming in Ride; this is not a guaranteed loss limit.`,
          "warning",
        ),
      );
  }
  if (d.funding) {
    const c = card("Fund your trading account"),
      f = d.funding;
    c.append(
      row("Amount", usdc(f.amount_usdc)),
      row("Status", f.status),
      row("Destination", f.destination),
    );
    const b = el("button", "Review and confirm funding in Ride");
    b.addEventListener("click", () => openLink(f.confirmation_url));
    c.append(
      b,
      el(
        "p",
        "No funds move until you confirm in Ride. Submitted or uncertain requests must be checked before retrying.",
        "muted",
      ),
    );
    root.append(c);
  }
  if (d.plan) {
    const plan = d.plan;
    root.append(
      el(
        "h1",
        d.query_scope === "agent_portfolio_and_ride_app"
          ? "Saved basket preview"
          : "Your trader basket",
      ),
      el(
        "p",
        `${usdc(plan.preferences.budget_usdc)} · ${plan.preferences.market} · ${plan.allocations.length} traders`,
        "muted",
      ),
      sleeveCards(plan.allocations, callTool),
    );
    const risk = card("Portfolio parameters");
    risk.append(
      row(
        "Selected allocation",
        usdc(sumCash(plan.allocations.map((a) => a.amount_usdc))),
      ),
      row("Unallocated budget", usdc(d.unallocated_usdc ?? "0.000000")),
      row("Loss trigger", `${plan.preferences.loss_trigger_pct}%`),
      row(
        "Historical portfolio drawdown",
        d.portfolio_historical_drawdown_pct == null
          ? "Unavailable"
          : `${d.portfolio_historical_drawdown_pct}%`,
      ),
      row("Existing entry deviation", "≤ 0.2%"),
      row("Plan expires", new Date(plan.expires_at).toLocaleString()),
    );
    root.append(risk);
    const start = el("button", "Review start proposal");
    start.disabled = plan.expires_at <= Date.now();
    start.addEventListener("click", () =>
      callTool("start_copy", {
        plan_id: plan.id,
        ...(start.dataset.compatibility
          ? { compatibility_ack: start.dataset.compatibility }
          : {}),
      }),
    );
    const refresh = el("button", "Refresh saved plan", "secondary");
    refresh.addEventListener("click", () =>
      callTool("recalculate_plan", {
        plan_id: plan.id,
      }),
    );

    renderCompatibility(root, plan, d, callTool, start);
    root.append(planEditor(plan, d, callTool, start));
    if (d.query_scope !== "agent_portfolio_and_ride_app")
      root.append(
        el(
          "div",
          "Preview works before funding. Use the Ride funding confirmation page to fund and activate the trading account, then refresh this saved plan and review a new proposal.",
          "warning",
        ),
      );
    const actions = el("div", null, "actions");
    const deposit = el("button", "Deposit into Ride", "secondary");
    deposit.addEventListener("click", () =>
      callTool("get_deposit_options", {}),
    );
    actions.append(start, refresh, deposit);
    root.append(actions);
    root.append(
      el(
        "p",
        "Perps follows source leverage with no extra user cap by default. You can set or clear your cap; exchange limits, budget and risk checks still apply. A single-trader plan is concentrated. Review each trader’s pause/exit rules before confirming.",
        "muted",
      ),
    );
  }
  if (d.portfolio) {
    const p = d.portfolio;
    root.append(
      el("h1", "Your portfolio"),
      el("p", `${p.state} · ${p.id}`, "muted"),
    );
    renderRiskStatus(root, p);
    if (p.activation && p.operational !== true) {
      const activation = card("Copying is not operational yet");
      activation.append(
        row("Account activated", p.account_bound ? "Yes" : "No"),
        row("Activation status", p.activation.status),
        el(
          "p",
          "Your configuration and funds are preserved. Confirmation alone does not mean copying has started.",
          "muted",
        ),
      );
      const reasons = {
        AGENT_WALLET_INACTIVE: "Set up the trading wallet in Rider.",
        EXECUTION_OWNER_CONFLICT: "Another strategy owns this trading account.",
        MANUAL_WRITER_ACTIVE:
          "Another operation currently controls the account.",
        APP_COPY_ACTIVE: "An existing Rider App copy is still enabled.",
        COPY_EVENTS_PROCESSING:
          "Existing copy operations are still processing.",
        APP_POSITIONS_OPEN: "Existing App positions must be reconciled first.",
        BALANCE_TRANSFER_PENDING:
          "An earlier account transfer has not reached a verified final state.",
        WITHDRAWAL_PENDING:
          "An earlier withdrawal has not reached a verified final state.",
      };
      for (const reason of p.activation.readiness?.blockers ?? [])
        activation.append(
          el(
            "p",
            reasons[reason] ?? "Account registration requires review.",
            "warning",
          ),
        );
      const error = p.activation.readiness?.error ?? p.activation.last_error;
      if (error) activation.append(el("p", error.message, "warning error"));
      if (p.activation.readiness?.eligible == null && !p.account_bound)
        activation.append(
          el(
            "p",
            "Account registration readiness has not been verified.",
            "warning",
          ),
        );
      root.append(activation);
    }
    const overview = card("Agent trading account snapshot");
    overview.append(
      row("Account value", usdc(p.account_value_usdc)),
      row("Reconciled net profit", usdc(p.net_profit_usdc)),
      row("Available funds", usdc(p.available_usdc)),
      row("Pending reserve", usdc(p.reserved_usdc)),
      row("Allocated funds", usdc(p.allocated_usdc)),
      row("Accounting", p.reconciliation),
    );
    const portfolioStop = field(
      overview,
      "Portfolio loss trigger · %",
      "number",
      p.preferences.loss_trigger_pct,
    );
    const changeStop = el(
      "button",
      "Review portfolio stop change",
      "secondary",
    );
    changeStop.addEventListener("click", () =>
      callTool("update_portfolio", {
        portfolio_id: p.id,
        loss_trigger_pct: Number(portfolioStop.value),
      }),
    );
    overview.append(changeStop);
    root.append(overview, sleeveCards(p.sleeves, callTool));
    const actions = el("div", null, "actions");
    for (const [label, name, args] of [
      ["Refresh portfolio", "get_portfolio", { portfolio_id: p.id }],
      ["Review portfolio", "review_portfolio", { portfolio_id: p.id }],
      [
        "Performance history",
        "get_performance",
        { portfolio_id: p.id, period: "weekly" },
      ],
      ["Daily report settings", "get_notification_preferences", {}],
    ]) {
      const b = el("button", label, "secondary");
      b.addEventListener("click", () => callTool(name, args));
      actions.append(b);
    }
    root.append(actions);
    for (const s of p.sleeves) {
      const controls = card(`${s.trader.handle} · manage copy`);
      const diagnostic = el("button", "Explain copy performance", "secondary");
      diagnostic.addEventListener("click", () => {
        const end = Date.now();
        callTool("diagnose_copy", {
          copy_id: s.copy_id,
          start_at: Math.max(
            p.ledger_started_at ?? p.created_at,
            end - 7 * 86400000,
          ),
          end_at: end,
        });
      });
      controls.append(diagnostic);
      if (s.state === "closed") {
        const replacement = field(
          controls,
          "Replacement public trader ID",
          "text",
          "",
        );
        const b = el("button", "Review replacement proposal", "secondary");
        b.addEventListener("click", () =>
          callTool("update_copy", {
            copy_id: s.copy_id,
            replacement_trader_id: replacement.value.trim(),
          }),
        );
        controls.append(
          b,
          el(
            "p",
            "Requires verified released funds; one replacement per rolling seven days. The previous copy remains in history.",
            "muted",
          ),
        );
      } else if (s.state === "active") {
        const close = el("button", "Review immediate exit", "secondary");
        close.addEventListener("click", () =>
          callTool("stop_copy", { copy_id: s.copy_id, mode: "close_now" }),
        );
        controls.append(close);
      }
      const margin = field(
          controls,
          "Allocation · USDC",
          "text",
          s.amount_usdc,
        ),
        leverage = field(
          controls,
          "Leverage cap · optional",
          "number",
          s.leverage_cap ?? "",
        ),
        pause = field(
          controls,
          "Trader pause/exit threshold · %",
          "number",
          s.stop_loss_pct,
        );
      leverage.min = "1";
      leverage.max = s.trader?.market === "prediction" ? "1" : "40";
      leverage.placeholder = "No extra cap · follow source";
      const mode = select(
        controls,
        "Copy mode",
        [
          ["ride_recommends", "Rider recommended"],
          ["fixed", "Fixed margin"],
          ["proportional", "Proportional"],
        ],
        s.copy_mode ?? "ride_recommends",
      );
      const fixed = field(
          controls,
          "Fixed margin per source entry · USDC",
          "text",
          s.fixed_margin_usdc ?? "10",
        ),
        multiplier = field(
          controls,
          "Proportional multiplier",
          "number",
          s.proportional_multiplier ?? 1,
        );
      const lossPolicy = select(
          controls,
          "Trader loss policy",
          [
            ["exit", "Exit at threshold"],
            ["pause_then_exit", "Pause, then emergency exit"],
          ],
          s.loss_policy ?? "exit",
        ),
        emergency = field(
          controls,
          "Emergency exit threshold · %",
          "number",
          s.emergency_exit_pct ?? 70,
        );
      const edit = el("button", "Review parameter change", "secondary");
      edit.disabled = s.state === "closed";
      edit.addEventListener("click", () =>
        callTool("update_copy", {
          copy_id: s.copy_id,
          amount_usdc: margin.value.trim(),
          leverage_cap:
            leverage.value.trim() === "" ? null : Number(leverage.value),
          stop_loss_pct: Number(pause.value),
          copy_mode: mode.value,
          ...(mode.value === "fixed"
            ? { fixed_margin_usdc: fixed.value.trim() }
            : { proportional_multiplier: Number(multiplier.value) }),
          loss_policy: lossPolicy.value,
          ...(lossPolicy.value === "pause_then_exit"
            ? { emergency_exit_pct: Number(emergency.value) }
            : {}),
        }),
      );
      controls.append(edit);
      if (s.state === "risk_off") {
        const resume = el("button", "Review resuming new trades", "secondary");
        resume.addEventListener("click", () =>
          callTool("update_copy", {
            copy_id: s.copy_id,
            resume_new_trades: true,
          }),
        );
        controls.append(resume);
      }
      root.append(controls);
    }
    for (const s of p.sleeves.filter((s) => s.state === "active")) {
      const stop = el("button", `Wind down ${s.trader.handle}`, "secondary");
      stop.addEventListener("click", () =>
        callTool("stop_copy", { copy_id: s.copy_id, mode: "wind_down" }),
      );
      root.append(stop);
    }
    const positions = card("Owned positions · gross and net");
    for (const a of p.positions ?? [])
      positions.append(
        row(
          `${a.asset} · ${a.market}`,
          `Gross ${usdc(a.gross_notional_usdc)} / Net ${usdc(a.net_notional_usdc)}`,
        ),
      );
    root.append(positions);
    if (p.executions?.length) {
      const executions = card("Execution status");
      for (const e of p.executions) executions.append(row(e.key, e.status));
      root.append(executions);
    }
  }
  if (d.trader) {
    const t = d.trader;
    root.append(
      el("h1", t.handle),
      el("p", `${t.market} · ${t.style} · ${t.direction}`, "muted"),
    );
    const profile = card(`Copy Score ${t.score}`);
    profile.append(row("Scoring version", t.score_version));
    for (const [key, value] of Object.entries(t.components ?? {}))
      profile.append(row(key, value));
    profile.append(
      row(
        "Source ROI",
        t.source_roi_pct == null ? "Unavailable" : `${t.source_roi_pct}%`,
      ),
      ...historyRows(t),
      row(
        "Source drawdown",
        t.source_drawdown_pct == null
          ? "Unavailable"
          : `${t.source_drawdown_pct}%`,
      ),
    );
    const single = el("button", "Copy this trader only", "secondary");
    single.addEventListener("click", () => {
      root.replaceChildren();
      welcome(
        root,
        (name, args) =>
          callTool(
            name,
            name === "recommend_traders"
              ? { ...args, trader_ids: [t.id], batch_action: undefined }
              : args,
          ),
        {
          ...(d.preferences ?? {}),
          portfolio_kind: "single",
          basket_size: 1,
          market: d.preferences?.market ?? t.market,
        },
      );
    });
    profile.append(single);
    if (d.saved_plan && d.saved_plan.preferences.portfolio_kind !== "single") {
      const add = el("button", "Add to saved basket", "secondary");
      add.addEventListener("click", () =>
        addToPlan(d.saved_plan, t, {}, callTool),
      );
      profile.append(add);
    }
    root.append(
      profile,
      el(
        "p",
        "Source performance describes the trader, not your follower account.",
        "muted",
      ),
    );
  }
  if (d.proposal) {
    const q = d.proposal;
    root.append(
      el(
        "h1",
        q.status === "requires_confirmation"
          ? "Review before confirming"
          : "Operation status",
      ),
      el("p", `${displayState(q.action)} · ${displayState(q.status)}`, "muted"),
    );
    renderProposalRiskStatus(root, d);
    if (q.preview?.portfolio?.portfolio)
      renderNestedPortfolio(root, q.preview.portfolio.portfolio);
    const params = card("Frozen parameters");
    params.append(
      row(
        "Actual portfolio status",
        displayState(
          q.actual_portfolio_state ??
            q.portfolio_state ??
            "No portfolio created",
        ),
      ),
      row("Loss trigger amount", usdc(q.preview?.loss_trigger_amount_usdc)),
      row("Existing entry deviation", "≤ 0.2%"),
      row(
        "Fee estimate",
        q.preview?.fees?.estimate_usdc == null
          ? "Unavailable · exact fee at settlement"
          : usdc(q.preview.fees.estimate_usdc),
      ),
      row("Expires", new Date(q.expires_at).toLocaleString()),
      row(
        "Execution state",
        q.status === "requires_confirmation"
          ? "Not submitted"
          : q.execution_tasks?.map((e) => displayState(e.status)).join(", ") ||
              displayState(q.status),
      ),
    );
    const details = el("details");
    details.append(
      el("summary", "View exact requested changes"),
      el("pre", JSON.stringify(q.arguments, null, 2)),
    );
    params.append(details);
    root.append(params);
    if (
      confirmationCard &&
      (q.status === "requires_confirmation" || d.confirmation_demo)
    ) {
      confirmationCard(root, q, d.confirmation_demo === true);
    } else if (q.status === "requires_confirmation" && q.confirmation_url) {
      const b = el("button", "Open Rider confirmation");
      b.addEventListener("click", () => openLink(q.confirmation_url));
      root.append(b);
    }
  }
  if (d.observations) {
    root.append(el("h1", "Portfolio review"));
    for (const o of d.observations)
      root.append(
        el(
          "p",
          Object.entries(o)
            .map(([k, v]) => `${k}: ${val(v)}`)
            .join(" · "),
          "card",
        ),
      );
    if (!d.observations.length)
      root.append(
        el("p", "No actionable observations from current coverage.", "muted"),
      );
  }
  if (d.updates) {
    root.append(el("h1", "Rider updates"));
    for (const u of d.updates) {
      const c = card(u.kind);
      c.append(
        el("p", u.message),
        el("time", new Date(u.at).toLocaleString(), "muted"),
      );
      root.append(c);
    }
    if (!d.updates.length) root.append(el("p", "No new updates.", "muted"));
  }
  if (d.performance) renderPerformance(root, d.performance, callTool);
  if (d.diagnostic) renderDiagnostic(root, d.diagnostic);
  if (d.notification_preferences) renderNotifications(root, d, callTool);
  for (const warning of value.warnings ?? [])
    root.append(el("p", warning, "warning"));
  root.append(
    el(
      "footer",

function renderCandidates(root, data, callTool) {

        ),
        row("Copy Score", t.score),
        ...historyRows(t),
        row("Trading assets", t.assets?.join(", ") || "Unavailable"),
        row("Qualification", t.eligibility),
      );

        data.recommendation_diagnostics?.candidate_evaluations ?? []

          ),

        check = el("input");

function drawPerformance(root, points, metric, label) {
  root.replaceChildren(el("h3", label));
  const valid = points.filter(
    (p) => p[metric] != null && Number.isFinite(Number(p[metric])),
  );
  if (!valid.length) {
    root.append(el("p", "Verified history is unavailable.", "muted"));
    return;
  }
  const ns = "http://www.w3.org/2000/svg",
    svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 640 220");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", `${label} in USDC`);
  const min = Math.min(...valid.map((p) => Number(p[metric]))),
    max = Math.max(...valid.map((p) => Number(p[metric]))),
    range = Math.max(1, max - min);
  const first = points[0].at,
    last = points.at(-1).at,
    span = Math.max(1, last - first),
    segments = [];
  let segment = [];
  let previous = null;
  for (const p of points) {
    if (p[metric] == null || !Number.isFinite(Number(p[metric]))) {
      if (segment.length) segments.push(segment);
      segment = [];
      previous = null;
      continue;
    }
    if (previous && p.at - previous.at > 2 * 86400000) {
      if (segment.length) segments.push(segment);
      segment = [];
    }
    const x = 62 + ((p.at - first) / span) * 558,
      y = 178 - ((Number(p[metric]) - min) / range) * 140;
    segment.push([x, y]);
    previous = p;
    const dot = document.createElementNS(ns, "circle");
    dot.setAttribute("cx", x);
    dot.setAttribute("cy", y);
    dot.setAttribute("r", "3");
    dot.setAttribute("fill", "#8c740c");
    const title = document.createElementNS(ns, "title");
    title.textContent = `${new Date(p.at).toLocaleDateString()}: ${p[metric]} USDC`;
    dot.append(title);
    svg.append(dot);
  }
  if (segment.length) segments.push(segment);
  for (const values of segments) {
    const path = document.createElementNS(ns, "polyline");
    path.setAttribute("points", values.map((v) => v.join(",")).join(" "));
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "#c3a017");
    path.setAttribute("stroke-width", "2");
    svg.append(path);
  }
  for (const [value, y] of [
    [max, 38],
    [min, 178],
  ]) {
    const text = document.createElementNS(ns, "text");
    text.setAttribute("x", "4");
    text.setAttribute("y", y);
    text.setAttribute("font-size", "11");
    text.textContent = value.toFixed(2);
    svg.append(text);
  }
  root.append(
    svg,
    el(
      "p",
      metric === "account_value_usdc"
        ? "Account value includes external funding. Use net profit to assess trading performance."
        : "Net profit excludes external deposits and withdrawals. Missing periods remain gaps.",
      "muted",
    ),
  );
}

    actions.querySelectorAll("button").forEach((b) => (b.disabled = true));
    try {
      const value = await call(operation, {
        proposal_id: config.proposal_id,
        ...(operation === "confirm"
          ? { preview_hash: proposal.preview_hash }
          : {}),
      });
      const next = checkedProposal(value);
      if (next.status === "requires_confirmation")
        throw Error("The confirmation result has not been verified.");
      proposal = next;
      submitting = false;
      render(content, value);
      actions.hidden = true;
      status.className = "";
      status.textContent = proposalStatusMessage(proposal);
      announce(proposal.status);
    } catch (e) {
      submitting = false;
      needsStatusCheck = true;
      // A definite HTTP/auth/validation rejection is different from a lost
      // response. Neither permits another submit before re-reading the same ID.
      const rejected =
        authError(e) ||
        (Number.isInteger(e?.httpStatus) &&
          e.httpStatus >= 400 &&
          e.httpStatus < 500);
      uncertainSubmission = !rejected;
      if (authError(e) || e?.code === "NOT_FOUND") showLogin();
      showError(
        Error(
          authError(e)
            ? "Your Ride sign-in session expired. Sign in to review this same proposal before trying again."
            : e?.code === "NOT_FOUND"
              ? "This proposal is not available for this Ride account. Sign in with the account that created it."
              : rejected
                ? `${e.message} The request was rejected. Refresh this proposal before trying again.`
                : `${e.message} The result is not yet verified. Refresh this same proposal; do not submit it again.`,
        ),
      );
      addRefresh();
      announce(rejected ? "request_rejected" : "submission_unknown");
    }
  };
}
function demo() {
  loginView.hidden = true;
  content.append(card("Demo confirmation · no trade"));
  content.firstElementChild.append(
    row("Action", "Interface confirmation test"),
    row("Amount", "0 USDC"),
    el(
      "p",
      "This demo does not connect to an account, exchange or execution service.",
      "muted",
    ),
  );
  actions.hidden = false;
  for (const id of ["approve", "reject"])
    document.getElementById(id).onclick = () => {
      actions.hidden = true;
      status.textContent =
        id === "approve"
          ? "Demo confirmed · no trade submitted"
          : "Demo cancelled · no trade submitted";
      content.append(
        el(
          "p",
          "Return to chat to review or adjust a proposal. Real copy trading requires its own confirmation.",
          "muted",
        ),
      );
      announce(id === "approve" ? "demo_confirmed" : "demo_rejected");
    };
  announce("demo_ready");
}
async function start() {
  if (config.demo) {
    demo();
    return;
  }
  status.textContent = "Restoring Ride sign-in…";
  const url = new URL(location.href),
    query = url.searchParams;
  const intendedProvider = knownProvider(query.get("auth_provider"));
  if (intendedProvider) sessionStorage.setItem(providerKey, intendedProvider);
  if (query.has("error") && !query.has("privy_oauth_code")) {
    url.searchParams.delete("error");
    url.searchParams.delete("error_description");
    history.replaceState({}, "", url.href);
    showLogin();
    showError(
      Error("Ride sign-in was cancelled. Your proposal has not been changed."),
    );
    return;
  }
  try {
    if (query.get("privy_oauth_code") && query.get("privy_oauth_state")) {
      const c = await init();
      const session = await c.auth.oauth.loginWithCode(
        query.get("privy_oauth_code"),
        query.get("privy_oauth_state"),
        savedProvider().toLowerCase(),
      );
      for (const key of ["privy_oauth_code", "privy_oauth_state"])
        url.searchParams.delete(key);
      history.replaceState({}, "", url.href);
      if (!(await finish(session))) showLogin();
      return;
    }
    try {
      csrf = (await call("session")).csrf;
      await ready();
      return;
    } catch (e) {
      if (!authError(e)) throw e;
      csrf = undefined;
    }
    // Reuse an existing Privy session; provider OAuth starts only on a button click.
    if (!embedded && (await finish())) return;
    status.textContent = "";
    showLogin();
  } catch (e) {
    showLogin();
    if (missingStoredSession(e)) {
      status.textContent = "";
      status.className = "";
    } else
      showError(
        e?.code === "NOT_FOUND"
          ? Error(
              "This proposal is not available for this Ride account. Sign in with the account that created it.",
            )
          : e,
      );
  }
}
start();
